[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iflow-mcp_joshylchen-zettelkasten"
version = "1.0.0"
description = "A comprehensive, AI-powered Zettelkasten knowledge management system with MCP integration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "JoshChen", email = "joshylchen@gmail.com"}
]
keywords = ["zettelkasten", "knowledge-management", "mcp", "model-context-protocol", "notes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
    "watchdog>=4.0.1",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "streamlit>=1.34.0",
    "jinja2>=3.1.4",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
zettelkasten-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/joshylchen/zettelkasten"
Repository = "https://github.com/joshylchen/zettelkasten"
Issues = "https://github.com/joshylchen/zettelkasten/issues"

[tool.setuptools.packages.find]
include = ["zettelkasten_assistant*"]

[tool.setuptools.package-data]
zettelkasten_assistant = ["*.py", "py.typed"]